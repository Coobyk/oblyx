[package]
name = "oblyx"
version = "0.1.0"
edition = "2024"

[features]
default = []
gui = ["dep:gpui-kit", "dep:rfd"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1"
fontdue = "0.9.4"
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
png = "0.18.1"
rayon = "1.12.0"
tiny-skia = { version = "0.12.0", features = ["png-format"] }
zip = "8.6.0"
gpui-kit = { version = "0.7.0", optional = true }
rfd = { version = "0.17", optional = true }

[[bin]]
name = "oblyx-gui"
path = "src/bin/oblyx_gui.rs"
required-features = ["gui"]

# Optimize framework dependencies while application code stays in debug mode.
# See GPUI Kit installation docs; only applies when the gui feature pulls them in.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
