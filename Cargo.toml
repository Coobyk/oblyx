[workspace]
members = ["web"]
default-members = ["."]

[package]
name = "oblyx"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "oblyx"

[features]
default = []
gui = ["dep:gpui-kit", "dep:rfd"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1"
fontdue = "0.9.4"
jpeg-encoder = "0.7.1"
png = "0.18.1"
rayon = "1.12.0"
tiny-skia = { version = "0.12.0", features = ["png-format"] }
gpui-kit = { version = "0.7.0", optional = true }
rfd = { version = "0.17", optional = true }

# Native: full zip codecs (bzip2/zstd C sources) and jpeg-decoder's rayon
# fast path. wasm32: GoodNotes zips are deflate-only, and rayon panics at
# runtime on the single-threaded wasm target, so both are trimmed there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jpeg-decoder = "0.3.2"
zip = "8.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[[bin]]
name = "oblyx-gui"
path = "src/bin/oblyx_gui.rs"
required-features = ["gui"]

# Optimize framework and conversion-hot dependencies while the rest of the
# debug build stays unoptimized. Keeps `cargo run`/debug GUI usable on
# 100 MB+ notebooks (inflate, path/text rendering and our own code dominate).
[profile.dev.package]
oblyx = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
flate2 = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
fontdue = { opt-level = 3 }
png = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
zip = { opt-level = 3 }
rayon = { opt-level = 3 }
rayon-core = { opt-level = 3 }
base64 = { opt-level = 3 }
