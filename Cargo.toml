[package]
name = "oblyx"
version = "0.1.0"
edition = "2024"

[features]
default = []
gui = ["dep:gpui-kit", "dep:rfd"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1"
fontdue = "0.9.4"
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
png = "0.18.1"
rayon = "1.12.0"
tiny-skia = { version = "0.12.0", features = ["png-format"] }
zip = "8.6.0"
gpui-kit = { version = "0.7.0", optional = true }
rfd = { version = "0.17", optional = true }

[[bin]]
name = "oblyx-gui"
path = "src/bin/oblyx_gui.rs"
required-features = ["gui"]

# Optimize framework and conversion-hot dependencies while the rest of the
# debug build stays unoptimized. Keeps `cargo run`/debug GUI usable on
# 100 MB+ notebooks (inflate, path/text rendering and our own code dominate).
[profile.dev.package]
oblyx = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
flate2 = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
fontdue = { opt-level = 3 }
png = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
zip = { opt-level = 3 }
rayon = { opt-level = 3 }
rayon-core = { opt-level = 3 }
base64 = { opt-level = 3 }
