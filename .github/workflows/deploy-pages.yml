# Build the browser app and deploy web/www to the Direct Upload Pages project
# `oblyx-converter` (oblyx.coobyk.com). Cloudflare Git integration cannot be
# attached to Direct Upload projects via API/wrangler, so CI owns auto-deploys.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Build WASM + UI
        run: |
          ./web/build.sh
          cd web/ui
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/www --project-name=oblyx-converter
