# Desktop binaries (CLI + GUI) for Linux / macOS / Windows, plus Pages deploy.
# - push to main: auto-versioned release (v<base>.r<commit-count>) + AUR publish
# - tag v*: release that version + AUR publish
# - workflow_dispatch: Pages deploy only
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + decide whether a release is needed
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            base="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
            ver="${base}.r$(git rev-list --count HEAD)"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # A release that already has assets means this is a re-run (e.g. a
          # manually pushed tag we already published); skip the pipeline.
          assets="$(gh release view "v${ver}" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          echo "needed=$([ "$assets" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version $ver (existing release assets: $assets)"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          # macos-13 is retired; macos-15-intel is the current x86_64 hosted runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-render0-dev \
            libxcb-keysyms1-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libfontconfig1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          cache-targets: false

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} --bin oblyx

      - name: Build GUI
        run: cargo build --release --target ${{ matrix.target }} --features gui --bin oblyx-gui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="oblyx-${VERSION}-${{ matrix.name }}"
          mkdir -p "$staging"
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ext=".exe"
          fi
          cp "target/${{ matrix.target }}/release/oblyx${ext}" "$staging/"
          cp "target/${{ matrix.target }}/release/oblyx-gui${ext}" "$staging/"
          cp LICENSE "$staging/" 2>/dev/null || true
          if command -v strip >/dev/null 2>&1 && [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "$staging/oblyx${ext}" "$staging/oblyx-gui${ext}" || true
          fi
          {
            echo "oblyx ${VERSION} (${{ matrix.name }})"
            echo
            echo "- oblyx${ext}      CLI converter"
            echo "- oblyx-gui${ext}  native GUI"
            echo
            echo "CLI:  ./oblyx${ext} -f pdf notebook.goodnotes"
            echo "GUI:  ./oblyx-gui${ext}"
          } > "$staging/README.txt"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "${staging}.zip" "$staging"
            echo "ASSET=${staging}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${staging}.tar.gz" "$staging"
            echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oblyx-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  pages:
    name: deploy pages
    runs-on: ubuntu-latest
    # Skip Pages deploy on version tags; those are for desktop releases.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: pages-wasm
          cache-targets: false

      - name: Build WASM + UI
        run: |
          ./web/build.sh
          cd web/ui
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/www --project-name=oblyx-converter

  release:
    name: github release
    needs: [version, desktop]
    if: needs.version.outputs.needed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: oblyx-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  aur:
    name: publish to AUR
    needs: [version, release]
    if: needs.version.outputs.needed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh base-devel curl

      - uses: actions/checkout@v4

      - name: Set up AUR SSH
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish oblyx, oblyx-bin, oblyx-gui, oblyx-gui-bin
        run: ./ci/publish-aur.sh "v${{ needs.version.outputs.version }}"
